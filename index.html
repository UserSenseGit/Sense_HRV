<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0e1117">
  <title>Sense HRV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <span class="logo">sense<b>·</b>hrv</span>
      <span class="header-date" id="headerDate"></span>
    </header>

    <!-- ============ VANDAAG ============ -->
    <section id="view-vandaag" data-view="vandaag" class="stack"></section>

    <!-- ============ METEN ============ -->
    <section id="view-meten" data-view="meten" class="stack" hidden>
      <div class="card connect-row">
        <div class="status"><span id="statusDot" class="status-dot"></span><span id="statusText">Niet verbonden</span></div>
        <button id="connectBtn" class="btn btn-sm">Verbinden</button>
      </div>

      <div class="sticky-top">
        <div id="resultCard" class="result-card" hidden>
          <div class="between small muted" style="margin-bottom: 8px;">
            <span>Resultaat actieve segmenten</span>
            <span id="activeCount">0 segmenten</span>
          </div>
          <div class="result-grid">
            <div><div class="lbl">Gem. HR</div><div class="num" id="resHR">--</div></div>
            <div><div class="lbl">rMSSD</div><div class="num" id="resRMSSD">--</div></div>
            <div><div class="lbl">Extrasystolen</div><div class="num alert-text" id="resExtra">--</div></div>
          </div>
        </div>

        <div class="card" style="padding: 12px;">
          <div class="between" style="margin-bottom: 8px;">
            <label class="row small" style="gap: 8px;">
              <span class="switch"><input type="checkbox" id="segmentToggle"><span class="slider-sw"></span></span>
              Segmenten maken
            </label>
            <button id="resetZoom" class="btn btn-sm btn-ghost">Reset zoom</button>
          </div>
          <div class="chart-wrap"><canvas id="mainChart" aria-label="Tachogram, hartslag per slag" role="img"></canvas></div>
        </div>
      </div>

      <div class="card rel">
        <div id="timerDisplay" class="recording" hidden>
          <span class="small muted">Opname loopt…</span>
          <div id="countdown" class="countdown">00:00</div>
          <div class="row" style="width: 100%; max-width: 300px;">
            <button id="swallowBtn" class="btn" style="flex: 1;">Slikken</button>
            <button id="stopEarlyBtn" class="btn btn-danger">Stop</button>
          </div>
        </div>
        <div class="live" style="margin-bottom: 14px;">
          <div><div class="small muted" style="margin-bottom: 4px;">Signaalkwaliteit</div><span id="qualityText" class="quality">Geen data</span></div>
          <div style="text-align: right;"><div class="small muted">Live HR</div><span id="liveHR" class="num" style="font-size: 26px;">--</span> <span class="unit">bpm</span></div>
        </div>
        <div class="row">
          <select id="duration" class="input" style="flex: 1;" aria-label="Duur van de meting">
            <option value="60">1 minuut</option>
            <option value="120">2 minuten</option>
            <option value="180" selected>3 minuten</option>
            <option value="300">5 minuten</option>
          </select>
          <button id="recordBtn" class="btn btn-primary" style="flex: 2;" disabled>Start opname</button>
        </div>
      </div>

      <div class="card">
        <h3 class="card-title">Auto-filter (bpm)</h3>
        <div class="grid-2" style="margin-bottom: 10px;">
          <div class="limit-box"><label class="small muted" for="limitMin">Ondergrens</label><input type="number" id="limitMin" value="45" inputmode="numeric"></div>
          <div class="limit-box"><label class="small muted" for="limitMax">Bovengrens</label><input type="number" id="limitMax" value="85" inputmode="numeric"></div>
        </div>
        <button id="autoSegmentBtn" class="btn btn-block">Auto-filter toepassen</button>
      </div>

      <div id="segmentSection" class="card" hidden>
        <div class="between" style="margin-bottom: 12px;">
          <h3 class="card-title" style="margin: 0;">Segmenten</h3>
          <button id="resetSegments" class="btn btn-sm btn-danger">Alles wissen</button>
        </div>
        <div id="segmentList" class="stack" style="gap: 10px;"></div>
      </div>

      <div id="saveSection" class="card stack" hidden>
        <h3 class="card-title" style="margin: 0;">Meting opslaan</h3>
        <div>
          <label class="lbl" for="saveDate">Datum</label>
          <input type="date" id="saveDate" class="input">
        </div>
        <div>
          <label class="lbl" for="saveExtra">Extrasystolen (automatisch geteld, aanpasbaar)</label>
          <input type="number" id="saveExtra" class="input" inputmode="numeric" min="0">
        </div>
        <button id="saveBtn" class="btn btn-ok btn-block">Opslaan en tags invullen</button>
      </div>
    </section>

    <!-- ============ HISTORIEK ============ -->
    <section id="view-historiek" data-view="historiek" hidden></section>

    <!-- ============ TRENDS ============ -->
    <section id="view-trends" data-view="trends" class="stack" hidden>
    </section>

    <!-- ============ MEER ============ -->
    <section id="view-meer" data-view="meer" class="stack" hidden></section>
  </div>

  <nav class="tabbar" aria-label="Hoofdmenu">
    <div class="tabbar-inner">
      <button class="tab" data-tab="vandaag">Vandaag</button>
      <button class="tab" data-tab="meten">Meten</button>
      <button class="tab" data-tab="historiek">Historiek</button>
      <button class="tab" data-tab="trends">Trends</button>
      <button class="tab" data-tab="meer">Meer</button>
    </div>
  </nav>

  <div id="sheet" class="sheet" hidden></div>

  <div id="modal" class="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h3 id="modalTitle"></h3>
      <p id="modalText"></p>
      <div class="grid-2">
        <button id="modalCancel" class="btn">Annuleren</button>
        <button id="modalOk" class="btn btn-primary">OK</button>
      </div>
    </div>
  </div>

  <div id="toast" role="status" aria-live="polite"><b id="tMsg"></b><span id="tSub"></span></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
